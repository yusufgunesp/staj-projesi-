[project]
name = "codeqa"
version = "0.1.0"
description = "Kod tabanını indeksleyip doğal dildeki sorulara dosya:satır referanslı cevap veren araç"
requires-python = ">=3.11"
# requirements.txt ile birebir aynı tutuluyor; ikisi ayrışırsa `pip install -e .`
# ile kurulan ortam ile `pip install -r requirements.txt` ile kurulan ortam farklı olur.
dependencies = [
    "anthropic>=0.40.0",
    "voyageai>=0.3.0",
    "numpy>=2.0",
    "rank-bm25>=0.2.2",
    "python-dotenv>=1.0",
    "mcp>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.14"]

[project.scripts]
codeqa = "codeqa.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["codeqa"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "SIM", "ARG", "RUF"]
ignore = [
    # Kod ve yorumlar Türkçe; "ı, ş, ğ" gibi harfleri belirsiz sayan kurallar
    # bu projede yalnızca gürültü üretiyor.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Testlerde sahte nesneler imzayı taklit etmek için kullanılmayan parametre alır.
"tests/*" = ["ARG002", "ARG001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
