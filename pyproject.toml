[project]
name = "codeqa"
version = "0.1.0"
description = "Kod tabanını indeksleyip doğal dildeki sorulara dosya:satır referanslı cevap veren araç"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "SIM", "ARG", "RUF"]
ignore = [
    # Kod ve yorumlar Türkçe; "ı, ş, ğ" gibi harfleri belirsiz sayan kurallar
    # bu projede yalnızca gürültü üretiyor.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Testlerde sahte nesneler imzayı taklit etmek için kullanılmayan parametre alır.
"tests/*" = ["ARG002", "ARG001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
